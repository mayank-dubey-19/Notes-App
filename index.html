<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style=" place-items: center; margin-left: 25px; margin-top: 7px; padding: 10px;">
 
    <div>
        <section class="sec0">

          <div class="header">

             <div class="title">📝 NOTES APP</div>
             <div class="search-bar" style=" margin-top: 1px; margin-right: 35px;"><input type="text" placeholder=" 🔍 search notes...." class="searchbar-input"  ></div>
             <div><input type="text" placeholder="Enter your notes tittle...." class="notes-title-input" ></div>
             <div class="save-btn" id="funtion-btn" >💾</div>
             <div class="delete-btn" id="funtion-btn">🚮</div>

          </div>

        </section>
    </div>
    
    <div style="display: flex;">
        <section class="sec1" style="margin-right:25px;">

           <div class="left-sidebar" style="width: 200px; height: 400px; padding:25px;  border-radius: 12px; box-shadow: 0px 2px 8px rgba(0,0,0,0.4);">
               
              <div class="notes-add-btn btn" > + NewNotes</div>
              <div class="all-notes-btn btn" > 📋 All Notes</div>
              
              <div class="notes-counter"> Total Notes : 00</div>

           </div>

        </section>

       <section class="sec1" style="margin-right:25px;">
           <div class="middle-sidebar" >
                <div class="m_s-tittle" > Your Notes</div>    
           </div>
       </section>
       <section class="sec3">
           <div class="right-sidebar" style="width: 430px; height: 410px; padding:20px; border-radius: 12px; box-shadow: 0px 2px 8px rgba(0,0,0,0.4);">
             <textarea name="" id="" placeholder="Write your text here ...." ></textarea>
           </div>
       </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
